<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neuro ICU Census</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14232e;--mut:#5d6f7c;--line:#d5dee5;--acc:#0b6e8a;--warn:#fff4d6;--warnb:#e0a800}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a21;--card:#17252e;--ink:#e8f0f4;--mut:#93a6b3;--line:#2b3d49;--acc:#4cc2e0;--warn:#3a3213;--warnb:#c9a227}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px;z-index:5}
.row{display:flex;gap:6px;margin-bottom:6px}
input,select,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input,select{flex:1}button{background:var(--acc);color:#fff;border:0;font-weight:600}button.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#alert{margin:10px;padding:10px;border:1px solid var(--warnb);background:var(--warn);border-radius:8px}
#alert summary{font-weight:700}#alert li{margin:6px 0;font-size:14px}
#msg{margin:6px 10px;font-size:14px;color:var(--acc)}
.pt{margin:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.pt h3{margin:0 0 4px;font-size:16px}.meta{color:var(--mut);font-size:13px}
.f{margin-top:6px;font-size:13px;white-space:pre-wrap}.f b{color:var(--mut)}.new{border-inline-start:4px solid var(--warnb)}
#login{padding:20px}
.tw{overflow-x:auto;margin:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}table{border-collapse:collapse;font-size:12px;min-width:1500px}th,td{border:1px solid var(--line);padding:6px;vertical-align:top;white-space:pre-wrap;min-width:90px}th{background:var(--bg)}tr.new td{background:var(--warn)}h4{margin:14px 10px 0}.ib{margin:12px 10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.lb{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-weight:600}
td.chg{background:var(--warn);font-weight:700}
#npw{margin:10px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px}#nt{display:block;width:100%;font:inherit;padding:8px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
table.sh{border-collapse:collapse;font-size:12px;min-width:1700px;table-layout:fixed}
table.sh th,table.sh td{border:1px solid #888;padding:5px;vertical-align:middle;text-align:center;white-space:pre-wrap;word-break:break-word}
table.sh tr.tt th{background:#1c1c1c;color:#fff;font-size:15px;text-align:center}
table.sh tr.hd th{background:#3b3b3b;color:#fff}
table.sh tr.g td{background:rgba(128,128,128,.18)}
table.sh tr.new td{background:var(--warn)}
table.sh td.chg{background:#ffe08a!important;color:#000;font-weight:700}
table.sh td.tl{text-align:start}
.ib .bs{display:flex;gap:6px}
</style></head><body>
<div id="app">
<header>
  <div class="row"><input id="q" placeholder="اسم المريض أو MRN"><select id="fld"></select></div>
  <div class="row"><input id="txt" placeholder="المعلومة الجديدة"><button id="sv">حفظ</button></div>
  <div class="row"><label class="lb" for="cam">📷 صوّر الcensus</label><button class="sec" id="fb">PDF كامل</button><input id="s" placeholder="بحث"></div>
  <div class="row"><button class="sec" id="nb" style="flex:1">➕ مريض جديد / تحديث برسالة</button></div>
  <input type="file" id="cam" accept="image/*" multiple hidden>
</header>
<div id="msg"></div>
<div id="ed" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:center;justify-content:center;padding:14px"><div style="background:var(--card);padding:12px;border-radius:12px;width:100%;max-width:520px"><b id="edt"></b><textarea id="edv" rows="8" style="display:block;width:100%;margin:8px 0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></textarea><div class="row"><button id="eds">حفظ التعديل</button><button class="sec" id="edc">إلغاء</button></div></div></div>
<div id="npw" hidden><b>➕ اكتب رسالة المريض</b><textarea id="nt" rows="7" placeholder="مثال: غرفة 1040 احمد علي MRN 123456 د. اولفة، 60 سنة ذكر، HX HTN DM، DX acute stroke، TT + NGT + IVC، feeding nova 50 ml/hr، CT brain done، MRSA pending، GCS 8/15 DNR"></textarea><div class="row" style="margin-top:8px"><button id="nps">حلّل وأضف</button><button class="sec" id="npc">إلغاء</button></div><div id="nst" style="margin-top:8px;font-weight:700;color:var(--acc)"></div><div style="font-size:12px;color:var(--mut)">لو المريض موجود (بالـ MRN أو الاسم) هيضيف المعلومات على بياناته.</div></div>
<details id="alert" open><summary id="asum"></summary><button class="sec" id="cp" style="margin:6px 0">⬇ PDF التعديلات</button><ul id="alist"></ul></details>
<div class="ib"><b>📋 الشيت الحالي (كل المرضى + التعديلات)</b><span class="bs"><button id="fp">⬇ PDF</button><button id="fx">⬇ Excel</button></span></div><div id="list"></div><h4>📷 الصور المقروءة (أرشيف)</h4><div id="imps"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,query,where,orderBy,limit,writeBatch,serverTimestamp,Timestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// >>> ضع إعدادات مشروعك هنا (Project settings > Your apps)
const app=initializeApp({apiKey:"AIzaSyDI-t55nwcocFL55OFFK5V6onJxIc-m-00",authDomain:"cences-51059.firebaseapp.com",projectId:"cences-51059",storageBucket:"cences-51059.firebasestorage.app",messagingSenderId:"1020457540151",appId:"1:1020457540151:web:56e69a4655638aa380bdb2"});
const db=getFirestore(app),auth=getAuth(app);
window.addEventListener('error',e=>{const m=document.getElementById('msg');if(m)m.textContent='JS خطأ: '+e.message});window.addEventListener('unhandledrejection',e=>{const m=document.getElementById('msg');if(m)m.textContent='خطأ: '+(e.reason&&e.reason.message||e.reason)});
const HOURS=6,$=id=>document.getElementById(id);
const L={room:'Room',mrn:'MRN',name:'Name',doctor:'Doctor',payer:'Payer',nationality:'Nationality',age:'Age',sex:'Sex',los:'LOS',admit_date:'Date of Admission',history:'History',connections:'Connections',infusions:'Infusions',labrad:'Lab & Rad',pending:'Pending',cs:'C/S Infection',remarks:'Remarks'};
const FIELDS=Object.keys(L),EDIT=['history','connections','infusions','labrad','pending','cs','remarks'];
let P=[],C=[],IM=[];
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const msg=t=>{$('msg').textContent=t;const n=$('nst');if(n)n.textContent=t};
const id_=p=>String(p.mrn||p.name).trim().toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,'-')||'x';
const t_=d=>d&&d.toDate?d.toDate():new Date();
EDIT.concat(['admit_date']).forEach(k=>$('fld').add(new Option(L[k],k)));

onAuthStateChanged(auth,u=>{if(u)start()});
signInAnonymously(auth).catch(e=>msg('خطأ دخول: '+e.message));

let started=false;
function start(){
  if(started)return;started=true;
  onSnapshot(collection(db,'patients'),s=>{P=s.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>String(a.room).localeCompare(String(b.room),undefined,{numeric:true}));render()},er=>msg('خطأ قاعدة البيانات: '+er.message));
  const since=()=>Timestamp.fromMillis(Date.now()-HOURS*36e5);
  onSnapshot(query(collection(db,'changes'),where('time','>=',since()),orderBy('time','desc')),s=>{C=s.docs.map(d=>d.data());render()});
  onSnapshot(query(collection(db,'imports'),orderBy('time','desc'),limit(10)),sn=>{IM=sn.docs.map(d=>{const x=d.data();let rows=[];try{rows=JSON.parse(x.rows)}catch(e){}return {when:t_(x.time).toLocaleString(),rows}});render()});
  setInterval(render,60000);
}
function render(){
  const cut=Date.now()-HOURS*36e5,s=$('s').value.toLowerCase(),rec=C.filter(c=>t_(c.time).getTime()>=cut);
  $('asum').textContent='آخر '+HOURS+' ساعات: '+rec.length+' تعديل';
  $('alist').innerHTML=rec.length?rec.map(c=>'<li><b>'+esc(c.name)+'</b> — '+esc(c.field)+': '+esc(c.now)+'</li>').join(''):'<li>مفيش تعديلات</li>';
  $('list').innerHTML=sheet(P.filter(p=>!s||(p.name+p.mrn+p.room).toLowerCase().includes(s)),p=>p.lastUpdated&&t_(p.lastUpdated).getTime()>cut,(p,k)=>rec.some(x=>x.source==='manual'&&x.name===p.name&&x.mrn===(p.mrn||'')&&x.field===L[k]),true);
  $('imps').innerHTML=IM.map((m,i)=>'<div class="ib"><b>📷 صورة '+esc(m.when)+' — '+m.rows.length+' مريض</b><span class="bs"><button data-a="pdf" data-i="'+i+'">⬇ PDF</button><button data-a="xls" data-i="'+i+'">⬇ Excel</button></span></div>'+sheet(m.rows)).join('');
}
function parseD(s){
  const m=String(s||'').match(/(\d{1,4})\D+(\d{1,2})\D+(\d{1,4})/);if(!m)return null;
  const now=Date.now()+864e5,ok=d=>d&&!isNaN(d)&&d.getTime()<=now;
  if(m[1].length===4){const d=new Date(+m[1],+m[2]-1,+m[3]);return ok(d)?d:null}
  let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
  const dm=(a<=31&&b<=12)?new Date(y,b-1,a):null,md=(b<=31&&a<=12)?new Date(y,a-1,b):null;
  if(a>12)return ok(dm)?dm:null;if(b>12)return ok(md)?md:null;
  return ok(dm)?dm:(ok(md)?md:null);
}
const losOf=p=>{const d=parseD(p.admit_date);if(!d)return p.los||'';return String(Math.max(0,Math.floor((new Date().setHours(0,0,0,0)-d.getTime())/864e5)))};
const HDR=['Room','P. Name','F. Status','Sex','Length of Stay','History','Connections','Infusions','Lab & Rad','Pending','C/S Infection','Remarks','Date of Admission'];
const BIG=['history','connections','infusions','labrad','pending','cs','remarks','admit_date'];
const idl=p=>(p.mrn?p.mrn+(p.doctor?'-':''):'')+(p.doctor||'');
function sheet(rows,fresh,flag,edit){
  const f=(p,k,x)=>k==='los'?'<td>'+esc(losOf(p))+'</td>':'<td'+(x||'')+(edit?' data-id="'+esc(p._id)+'" data-k="'+k+'"':'')+((flag&&flag(p,k))?' class="chg"':(BIG.includes(k)&&k!=='admit_date'?' class="tl"':''))+'>'+esc(p[k])+'</td>';
  const rs=' rowspan="2"';
  return '<div class="tw"><table class="sh"><colgroup><col style="width:60px"><col style="width:150px"><col style="width:90px"><col style="width:50px"><col style="width:60px"><col style="width:200px"><col style="width:170px"><col style="width:140px"><col style="width:200px"><col style="width:140px"><col style="width:200px"><col style="width:200px"><col style="width:90px"></colgroup><tr class="tt"><th colspan="13">NEURO-ICU</th></tr><tr class="hd">'+HDR.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+
  rows.map((p,i)=>{const c=(i%2?'g ':'')+(fresh&&fresh(p)?'new':'');
    return '<tr class="'+c+'">'+f(p,'room',rs)+f(p,'name')+f(p,'payer')+f(p,'sex')+f(p,'los')+BIG.map(k=>f(p,k,rs)).join('')+'</tr><tr class="'+c+'"><td>'+esc(idl(p))+'</td>'+f(p,'nationality')+f(p,'age')+'<td></td></tr>'}).join('')+'</table></div>';
}
function pdfSheet(rows,title,fname){
  const d=new jspdf.jsPDF({orientation:'landscape',format:'a3'});
  d.text(title,10,12);
  const body=[];
  rows.forEach(p=>{
    body.push([{content:p.room||'',rowSpan:2},p.name||'',p.payer||'',p.sex||'',losOf(p),...BIG.map(k=>({content:p[k]||'',rowSpan:2}))]);
    body.push([idl(p),p.nationality||'',p.age||'','']);
  });
  d.autoTable({startY:18,theme:'grid',styles:{fontSize:6,cellPadding:1.5,valign:'middle',lineColor:[110,110,110],lineWidth:.2},headStyles:{fillColor:[40,40,40]},
    head:[[{content:'NEURO-ICU',colSpan:13,styles:{halign:'center',fontSize:9}}],HDR],body});
  d.save(fname+'.pdf');
}
async function xlsxSheet(rows,fname){
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('NEURO-ICU');
  [8,22,13,6,9,34,28,24,34,24,34,34,13].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const bd={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
  ws.addRow(['NEURO-ICU  '+new Date().toLocaleDateString('en-GB')]);ws.mergeCells(1,1,1,13);
  const t=ws.getRow(1);t.height=24;t.getCell(1).font={bold:true,size:14,color:{argb:'FFFFFFFF'}};t.getCell(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1C1C1C'}};t.getCell(1).alignment={horizontal:'center',vertical:'middle'};
  const h=ws.addRow(HDR);h.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF3B3B3B'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=bd});
  rows.forEach((p,i)=>{
    const r=ws.rowCount+1;
    ws.addRow([p.room||'',p.name||'',p.payer||'',p.sex||'',losOf(p),...BIG.map(k=>p[k]||'')]);
    ws.addRow(['',idl(p),p.nationality||'',p.age||'','']);
    [1,6,7,8,9,10,11,12,13].forEach(c=>ws.mergeCells(r,c,r+1,c));
    for(let k=r;k<=r+1;k++){ws.getRow(k).eachCell({includeEmpty:true},(c,n)=>{c.border=bd;c.alignment={vertical:'middle',horizontal:(n>=6&&n<=12)?'left':'center',wrapText:true};if(i%2)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE6E6E6'}}})}
    const ln=Math.max(...BIG.map(k=>String(p[k]||'').split('\n').reduce((n,l)=>n+Math.max(1,Math.ceil(l.length/30)),0)),2);
    const hh=Math.min(ln*7.5+4,300);ws.getRow(r).height=hh;ws.getRow(r+1).height=hh;
  });
  ws.views=[{state:'frozen',ySplit:2}];
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=fname+'.xlsx';document.body.appendChild(a);a.click();a.remove();
}
const stamp_=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
function fullPdf(){pdfSheet(P,'Neuro ICU Census '+new Date().toLocaleString(),'Census_'+stamp_())}
$('fp').onclick=fullPdf;
$('fx').onclick=()=>xlsxSheet(P,'Census_'+stamp_()).catch(e=>msg('خطأ Excel: '+e.message));
$('imps').onclick=e=>{const b=e.target.closest&&e.target.closest('button');if(!b||b.dataset.i===undefined)return;const m=IM[b.dataset.i];if(!m)return;const n='Census_photo_'+m.when.replace(/[^0-9]+/g,'-');
  if(b.dataset.a==='xls')xlsxSheet(m.rows,n).catch(er=>msg('خطأ Excel: '+er.message));else pdfSheet(m.rows,'Neuro ICU Census - photo '+m.when,n)};
$('cp').onclick=e=>{e.preventDefault();changesPdf()};
$('s').oninput=render;

function changesPdf(extra){
  const cut=Date.now()-HOURS*36e5,rows=C.concat(extra||[]).filter(c=>t_(c.time).getTime()>=cut||!c.time||!c.time.toDate);
  if(!rows.length)return;
  const d=new jspdf.jsPDF({orientation:'landscape'});
  d.text('Neuro ICU - Changes (last '+HOURS+'h) '+new Date().toLocaleString(),10,12);
  d.autoTable({startY:18,styles:{fontSize:8},head:[['Time','Patient','MRN','Field','Before','Now']],
    body:rows.map(c=>[t_(c.time).toLocaleString(),c.name,c.mrn,c.field,c.old,c.now])});
  d.save('Changes_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.pdf');
}
$('fb').onclick=fullPdf;

$('sv').onclick=async()=>{
  const q=$('q').value.trim().toLowerCase(),f=$('fld').value,t=$('txt').value.trim();
  if(!q||!t)return msg('اكتب اسم/MRN والمعلومة');
  let m=P.filter(p=>String(p.mrn).toLowerCase()===q);if(!m.length)m=P.filter(p=>String(p.name).toLowerCase().includes(q));
  if(!m.length)return msg('المريض مش موجود');
  if(m.length>1)return msg('أكتر من مريض: '+m.map(p=>p.name+' ('+p.mrn+')').join(' / '));
  const p=m[0],stamp=new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),line='['+stamp+'] '+t,old=p[f]||'';
  const b=writeBatch(db);
  const isD=f==='admit_date';
  b.update(doc(db,'patients',p._id),{[f]:isD?t:(old?old+'\n':'')+line,lastUpdated:serverTimestamp()});
  const ch={time:serverTimestamp(),mrn:p.mrn||'',name:p.name,field:L[f],old,now:isD?t:line,source:'manual',by:'public'};
  b.set(doc(collection(db,'changes')),ch);
  try{await b.commit();$('txt').value='';msg('تم الحفظ: '+p.name);setTimeout(()=>changesPdf(),1200)}catch(e){msg(e.message)}
};


const MODELS=['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-2.5-flash'];
async function gem(parts,o){
  o=o||{};const MS=o.models||MODELS,RN=o.rounds||2,TM=o.tmo||40000;
  let key=localStorage.getItem('gk');
  if(!key){key=prompt('الصق مفتاح Gemini API (مرة واحدة على الجهاز ده)');if(!key)throw new Error('مفيش مفتاح');localStorage.setItem('gk',key.trim())}
  const body=JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json'}});
  let last='';
  for(let round=0;round<RN;round++){
    for(const M of MS){
      msg('قراءة بـ '+M+' ...');
      let r,j;
      const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),TM);
      try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+M+':generateContent',{method:'POST',headers:{'x-goog-api-key':key,'content-type':'application/json'},body,signal:ac.signal});j=await r.json()}catch(e){last=e.name==='AbortError'?'الموديل '+M+' اتأخر':e.message;clearTimeout(tm);continue}
      clearTimeout(tm);
      if(j.error){last=j.error.message;
        if(r.status===400&&/API key/i.test(last)||r.status===403){localStorage.removeItem('gk');throw new Error('المفتاح غلط أو مش مفعّل: '+last)}
        continue}
      const txt=(j.candidates&&j.candidates[0]&&j.candidates[0].content.parts||[]).map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
      try{return JSON.parse(txt)}catch(e){last='مقدرتش أقرا الرد';continue}
    }
    if(round<RN-1){msg('الخدمة مشغولة، بحاول تاني...');await new Promise(r=>setTimeout(r,6000))}
  }
  throw new Error(last||'فشلت القراءة');
}
async function extract({image}){
  const p='This is a photo of a Neuro-ICU census table (may be rotated). Extract EVERY patient. Each patient occupies TWO table rows that share merged cells: row 1 has name, payer (F.Status), sex, length of stay; row 2 has MRN-doctor (e.g. 2296455-DR.AYOUB), nationality and age; room number is in the first column; history, connections, infusions, lab&rad, pending, C/S infection, remarks and admission date span both rows. Merge both rows into ONE object per patient. Return ONLY a JSON array. Keys per item: '+FIELDS.join(', ')+'. mrn = the number before the doctor name; doctor = e.g. "DR OLFA". Keep abbreviations as written. Use "" for empty fields.';
  return {data:{patients:await gem([{inline_data:{mime_type:'image/jpeg',data:image}},{text:p}])}};
}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,2200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85).split(',')[1])};i.src=URL.createObjectURL(f)})}
$('cam').onchange=async e=>{
  const fs=[...e.target.files];let added=0,changed=0,errs=[];msg('تم اختيار '+fs.length+' صورة');if(!fs.length)return;
  for(let n=0;n<fs.length;n++){
    msg('قراءة صورة '+(n+1)+' من '+fs.length+' ... (ممكن تاخد دقيقة)');
    try{
      const res=await extract({image:await shrink(fs[n])}),b=writeBatch(db);
      b.set(doc(collection(db,'imports')),{time:serverTimestamp(),rows:JSON.stringify(res.data.patients),n:n+1});
      if(!res.data.patients.length)throw new Error('القراءة رجّعت 0 مريض');
      res.data.patients.forEach(x=>{
        const ex=P.find(p=>p._id===id_(x));
        if(!ex){b.set(doc(db,'patients',id_(x)),{...Object.fromEntries(FIELDS.map(k=>[k,x[k]||''])),lastUpdated:serverTimestamp()});
          b.set(doc(collection(db,'changes')),{time:serverTimestamp(),mrn:x.mrn||'',name:x.name,field:'New patient',old:'',now:'Room '+x.room,source:'photo'});added++}
        else{const u={};FIELDS.forEach(k=>{const a=String(ex[k]||'').trim(),v=String(x[k]||'').trim();
            if(v&&a!==v&&k!=='los'){u[k]=v;b.set(doc(collection(db,'changes')),{time:serverTimestamp(),mrn:ex.mrn||'',name:ex.name,field:L[k],old:a,now:v,source:'photo'})}});
          if(Object.keys(u).length){u.lastUpdated=serverTimestamp();b.update(doc(db,'patients',ex._id),u);changed++}}
      });
      await b.commit();
    }catch(err){errs.push(err.message)}
  }
  msg(errs.length?'❌ فشل: '+errs.join(' | '):'جديد: '+added+' | اتغير: '+changed);e.target.value='';
};


function localParse(t){
  const clean=l=>l.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/^[\s\-•*·▪►]+/,'').trim();
  const lines=t.split(/\r?\n/).map(clean).filter(Boolean);
  const x=Object.fromEntries(FIELDS.map(k=>[k,'']));
  const put=(k,v)=>{x[k]=(x[k]?x[k]+' - ':'')+v};
  let m;
  const all=lines.join('\n');
  m=all.match(/(?:patient(?:\s*name)?|name|الاسم|اسم المريض)\s*[:：]\s*([^\n]+)/i);
  if(m){x.name=m[1].split(/\s\d{1,3}\s*(?:years?|yrs?|y\b|سنة|سنه)/i)[0].replace(/[\/,،]+\s*$/,'').trim()}
  m=all.match(/(?:date\s*of\s*admission|admission\s*date|admit\s*date|تاريخ\s*(?:ال)?دخول)\s*[:：]?\s*(\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4})/i);if(m)x.admit_date=m[1];
  m=all.match(/MRN\s*[:：#]?\s*(\d{4,10})/i)||all.match(/\b(\d{6,8})\b/);if(m)x.mrn=m[1];
  m=all.match(/(\d{1,3})\s*(?:years?|yrs?|y\b|سنة|سنه)/i);if(m)x.age=m[1];
  m=all.match(/\b(male|female)\b|(ذكر|انثى|أنثى)/i);if(m)x.sex=/^(male|ذكر)$/i.test(m[0])?'M':'F';
  m=all.match(/(?:male|female)\s*\/\s*([A-Za-z\u0600-\u06ff]+)/i);if(m)x.nationality=m[1].toUpperCase();
  m=all.match(/(?:neuro\s*icu|\bicu|room|bed|غرفة|سرير)\s*#?\s*(\d{3,4}\s*-?\s*[A-Za-z]?)\b/i);if(m)x.room=m[1].replace(/\s+/g,'').toUpperCase();
  m=all.match(/(?:\bdr\.?\s*\/?\s*|د\.\s*|دكتور\s+)([A-Za-z\u0600-\u06ff]+)/i);if(m)x.doctor='DR '+m[1].toUpperCase();
  lines.forEach(l=>{
    if(/^(patient|name|mrn|الاسم|اسم المريض)\b/i.test(l))return;
    if(/(date\s*of\s*admission|admission\s*date|admit\s*date|تاريخ\s*(?:ال)?دخول)/i.test(l))return;
    if(/^(admission|adm\b)/i.test(l))put('history',l);
    else if(/\b(hx|medical|history|pmh|dx|diagnosis|c\/o|surgery|surgical|allerg)/i.test(l))put('history',l);
    else if(/\b(connections?|lines?|access|ett|tt|ivc|cvc|ngt|foley|peg)\b/i.test(l))put('connections',l);
    else if(/\b(feeding|infusions?|drip|ns|rl|ringer|nova|resource)\b/i.test(l))put('infusions',l);
    else if(/\b(pending|s\/f)\b/i.test(l))put('pending',l);
    else if(/\b(c\/s|cultures?|mrsa|candida|sputum|swab)\b/i.test(l))put('cs',l);
    else if(/\b(ct|mri|mra|cta|ecg|echo|doppler|x-?ray|cxr|labs?|holter|eeg|uss?|intervention)\b/i.test(l))put('labrad',l);
    else put('remarks',l);
  });
  return x;
}
let EC=null;
$('list').onclick=e=>{const td=e.target.closest&&e.target.closest('td[data-k]');if(!td)return;const p=P.find(x=>x._id===td.dataset.id);if(!p)return;EC={p,k:td.dataset.k};$('edt').textContent=p.name+' — '+L[EC.k];$('edv').value=p[EC.k]||'';$('ed').style.display='flex'};
$('edc').onclick=()=>{$('ed').style.display='none'};
$('eds').onclick=async()=>{if(!EC)return;const v=$('edv').value.trim(),p=EC.p,k=EC.k;
  if(v===String(p[k]||'').trim()){$('ed').style.display='none';return}
  const b=writeBatch(db);b.update(doc(db,'patients',p._id),{[k]:v,lastUpdated:serverTimestamp()});
  b.set(doc(collection(db,'changes')),{time:serverTimestamp(),mrn:p.mrn||'',name:p.name,field:L[k],old:String(p[k]||''),now:v,source:'manual',by:'public'});
  try{await b.commit();$('ed').style.display='none';msg('✅ اتعدّل: '+L[k])}catch(er){msg('خطأ: '+er.message)}};
$('nb').onclick=()=>{$('npw').hidden=!$('npw').hidden;if(!$('npw').hidden)$('npw').scrollIntoView({behavior:'smooth'})};
$('npc').onclick=()=>{$('npw').hidden=true};
$('nps').onclick=async()=>{
  const t=$('nt').value.trim();if(!t)return msg('اكتب الرسالة الأول');
  $('nps').disabled=true;msg('⏳ بحلل الرسالة، استنى 10-30 ثانية...');
  try{
    const pr='Parse this message about ONE ICU patient (Arabic/English mixed). Return ONLY one JSON object with keys: '+FIELDS.join(', ')+'. Keep the text as written, keep medical abbreviations, do not translate. Put each piece of info in the best field: history = HX, DM, HTN, DX, DOA, past history; connections = ETT, TT, IVC, CVC, NGT, SC, Foley, lines and dates; infusions = feeding, fluids, drugs; labrad = CT, MRI, echo, doppler, labs, X-ray done; pending = pending or S/F items; cs = cultures, MRSA, candida, sputum, blood C/S; remarks = GCS, RASS, DNR, restraint, blood products, other notes. admit_date = date of admission exactly as written. Use "" for anything not mentioned. Do not invent data.\n\nMESSAGE:\n'+t;
    let x;
    try{x=await gem([{text:pr}],{tmo:25000,models:MODELS.slice(0,3),rounds:1});if(Array.isArray(x))x=x[0]}catch(e){msg('⚠️ الذكاء مشغول، بحلل الرسالة بالطريقة العادية...');x=null}
    if(!x||!(x.name||x.mrn)){const y=localParse(t);x=Object.assign({},y,Object.fromEntries(Object.entries(x||{}).filter(([k,v])=>String(v||'').trim())))}
    const nm=String(x.name||'').trim(),mr=String(x.mrn||'').trim();
    if(!nm&&!mr)throw new Error('مفيش اسم أو MRN في الرسالة');
    const ex=P.find(p=>mr&&String(p.mrn).trim()===mr)||P.find(p=>nm&&String(p.name).toLowerCase().includes(nm.toLowerCase()));
    const stamp=new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),b=writeBatch(db);
    const logc=(p,f,o,n)=>b.set(doc(collection(db,'changes')),{time:serverTimestamp(),mrn:p.mrn||'',name:p.name,field:f,old:o,now:n,source:'manual',by:'public'});
    if(!ex){
      const data=Object.fromEntries(FIELDS.map(k=>[k,String(x[k]||'').trim()]));
      b.set(doc(db,'patients',id_(data)),{...data,lastUpdated:serverTimestamp()});
      logc(data,'New patient','','Room '+(data.room||'-'));
      await b.commit();msg('✅ تم إضافة مريض جديد: '+(data.name||data.mrn));
    }else{
      const u={};
      FIELDS.forEach(k=>{const v=String(x[k]||'').trim();if(!v||k==='name')return;
        if(EDIT.includes(k)){const nw='['+stamp+'] '+v;u[k]=(ex[k]?ex[k]+'\n':'')+nw;logc(ex,L[k],String(ex[k]||''),nw)}
        else if(String(ex[k]||'').trim()!==v){u[k]=v;logc(ex,L[k],String(ex[k]||''),v)}});
      if(!Object.keys(u).length)throw new Error('مفيش معلومة جديدة في الرسالة');
      u.lastUpdated=serverTimestamp();b.update(doc(db,'patients',ex._id),u);
      await b.commit();msg('✅ اتحدّث: '+ex.name+' ('+(Object.keys(u).length-1)+' خانة)');
    }
    $('nt').value='';$('npw').hidden=true;
  }catch(e){msg('❌ '+e.message)}
  finally{$('nps').disabled=false}
};
